<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - Wedding Cards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cinzel:wght@400;600;700&family=Playfair+Display:wght@400;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      padding: 20px;
      background: rgba(255,255,255,0.95);
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Great Vibes', cursive;
      font-size: 1.8rem;
      color: #667eea;
    }
    .logo i { font-size: 1.4rem; }
    .nav-links { display: flex; gap: 16px; }
    .nav-links a {
      text-decoration: none;
      color: #333;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: 8px;
      transition: background 0.3s;
    }
    .nav-links a:hover { background: #f0f0f0; }
    
    .profile-card {
      background: white;
      border-radius: 16px;
      padding: 32px;
      margin-bottom: 32px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    .profile-header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
      padding-bottom: 24px;
      border-bottom: 2px solid #f0f0f0;
    }
    .profile-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 2rem;
      font-weight: 600;
    }
    .profile-info h1 {
      font-family: 'Cinzel', serif;
      color: #333;
      margin-bottom: 8px;
    }
    .profile-info p { color: #666; }
    
    .section-title {
      font-family: 'Cinzel', serif;
      font-size: 1.4rem;
      color: #333;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-title i { color: #667eea; }
    
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .card-item {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 20px;
      border: 2px solid #e0e0e0;
      transition: all 0.3s;
    }
    .card-item:hover {
      border-color: #667eea;
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(102, 126, 234, 0.2);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .card-slug {
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      color: #333;
      font-weight: 600;
    }
    .card-status {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .card-status.draft { background: #fff3cd; color: #856404; }
    .card-status.published { background: #d4edda; color: #155724; }
    
    .card-details {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 16px;
    }
    .card-details div { margin-bottom: 4px; }
    
    .card-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .card-actions button, .card-actions a {
      flex: 1;
      padding: 8px 12px;
      border: none;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      transition: all 0.3s;
    }
    .btn-view {
      background: #667eea;
      color: white;
    }
    .btn-view:hover { background: #5a6fd6; }
    .btn-edit {
      background: #f0f0f0;
      color: #333;
    }
    .btn-edit:hover { background: #e0e0e0; }
    .btn-share {
      background: #28a745;
      color: white;
    }
    .btn-share:hover { background: #218838; }
    .btn-delete {
      background: #dc3545;
      color: white;
    }
    .btn-delete:hover { background: #c82333; }
    .card-private-note {
      flex: 1 1 100%;
      font-size: 0.8rem;
      color: #856404;
      background: #fff3cd;
      padding: 8px 12px;
      border-radius: 8px;
      text-align: center;
    }
    
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #666;
    }
    .empty-state i {
      font-size: 4rem;
      color: #ddd;
      margin-bottom: 20px;
    }
    .empty-state h3 {
      font-family: 'Cinzel', serif;
      margin-bottom: 12px;
      color: #333;
    }
    .btn-create {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: transform 0.3s;
    }
    .btn-create:hover { transform: translateY(-2px); }
    
    .loading {
      text-align: center;
      padding: 40px;
      color: #666;
    }
    .loading i {
      font-size: 2rem;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .message {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      text-align: center;
    }
    .message.error { background: #fee; color: #c00; }
    .message.success { background: #efe; color: #060; }
    
    .share-modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .share-modal.active { display: flex; }
    .share-content {
      background: white;
      padding: 32px;
      border-radius: 16px;
      max-width: 500px;
      width: 90%;
      text-align: center;
    }
    .share-content h3 {
      font-family: 'Cinzel', serif;
      margin-bottom: 16px;
      color: #333;
    }
    .share-url {
      background: #f8f9fa;
      padding: 12px;
      border-radius: 8px;
      margin: 16px 0;
      word-break: break-all;
      font-family: monospace;
      font-size: 0.9rem;
    }
    .share-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    .share-actions button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-copy { background: #667eea; color: white; }
    .btn-copy:hover { background: #5a6fd6; }
    .btn-close { background: #f0f0f0; color: #333; }
    .btn-close:hover { background: #e0e0e0; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">
        <i class="fas fa-wand-magic-sparkles"></i>
        <span>WedCard</span><span style="color:#764ba2;">Builder</span>
      </div>
      <div class="nav-links">
        <a href="/"><i class="fas fa-home"></i> Home</a>
        <a href="#templates"><i class="fas fa-th-large"></i> Templates</a>
        <a href="/ai-design/"><i class="fas fa-magic"></i> AI Designer</a>
        <a href="javascript:void(0)" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
      </div>
    </div>
    
    <div class="profile-card">
      <div class="profile-header">
        <div class="profile-avatar" id="avatar-initials">U</div>
        <div class="profile-info">
          <h1>My Profile</h1>
          <p id="user-email">Loading...</p>
        </div>
      </div>
      
      <h2 class="section-title"><i class="fas fa-id-card"></i> My Wedding Cards</h2>
      
      <div id="cards-container">
        <div class="loading"><i class="fas fa-spinner"></i> Loading your cards...</div>
      </div>
    </div>
  </div>
  
  <!-- Share Modal -->
  <div class="share-modal" id="share-modal">
    <div class="share-content">
      <h3><i class="fas fa-share-alt"></i> Share Your Invitation</h3>
      <p>Send this unique link to your guests:</p>
      <div class="share-url" id="share-url"></div>
      <div class="share-actions">
        <button class="btn-copy" onclick="copyShareLink()"><i class="fas fa-copy"></i> Copy Link</button>
        <button class="btn-close" onclick="closeShareModal()">Close</button>
      </div>
    </div>
  </div>
  
  <script>
    const API_BASE = '';
    let currentUser = null;
    let userCards = [];
    
    // Check authentication on load
    window.addEventListener('DOMContentLoaded', async () => {
      await checkAuth();
      if (currentUser) {
        loadUserCards();
      }
    });
    
    async function checkAuth() {
      const token = localStorage.getItem('authToken');
      if (!token) {
        window.location.href = '/auth';
        return;
      }
      
      try {
        const response = await fetch(`${API_BASE}/api/auth/me`, {
          headers: { 'Authorization': `Bearer ${token}` },
        });
        
        if (!response.ok) {
          throw new Error('Session expired');
        }
        
        const data = await response.json();
        currentUser = data.user;
        document.getElementById('user-email').textContent = currentUser.email;
        document.getElementById('avatar-initials').textContent = currentUser.email.charAt(0).toUpperCase();
      } catch (err) {
        localStorage.removeItem('authToken');
        localStorage.removeItem('user');
        window.location.href = '/auth';
      }
    }
    
    async function loadUserCards() {
      const container = document.getElementById('cards-container');
      
      try {
        const response = await fetch(`${API_BASE}/api/cards`, {
          headers: { 'Authorization': `Bearer ${localStorage.getItem('authToken')}` },
        });
        
        if (!response.ok) {
          throw new Error('Failed to load cards');
        }
        
        const data = await response.json();
        userCards = data.cards || [];
        
        if (userCards.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <i class="fas fa-envelope-open"></i>
              <h3>No Cards Yet</h3>
              <p>Create your first wedding invitation card!</p>
              <a href="/#templates" class="btn-create"><i class="fas fa-plus"></i> Create Card</a>
            </div>
          `;
        } else {
          renderCards(container);
        }
      } catch (err) {
        container.innerHTML = `<div class="message error">Error loading cards: ${err.message}</div>`;
      }
    }
    
    function renderCards(container) {
      container.innerHTML = `
        <div class="cards-grid">
          ${userCards.map(card => `
            <div class="card-item">
              <div class="card-header">
                <div class="card-slug">${escapeHtml(card.title || card.slug)}</div>
                <span class="card-status ${card.status}">${card.status}</span>
              </div>
              <div class="card-details">
                <div><i class="fas fa-palette"></i> Template: ${escapeHtml(card.template_id)}</div>
                <div><i class="fas fa-clock"></i> Updated: ${new Date(card.updated_at).toLocaleDateString()}</div>
              </div>
              <div class="card-actions">
                ${card.share_slug ? `
                  <a href="/${card.share_slug}" target="_blank" class="btn-view"><i class="fas fa-eye"></i> View</a>
                  <button class="btn-share" onclick="showShareModal('${card.share_slug}')"><i class="fas fa-share-alt"></i> Share</button>
                ` : `
                  <span class="card-private-note"><i class="fas fa-lock"></i> Private draft &mdash; upgrade to get a shareable link</span>
                `}
                <a href="/templates/${card.template_id}/editor.html?slug=${card.slug}" class="btn-edit"><i class="fas fa-edit"></i> Edit</a>
                <button class="btn-delete" onclick="deleteCard('${card.slug}')"><i class="fas fa-trash"></i> Delete</button>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }
    
    function showShareModal(slug) {
      const shareUrl = `${window.location.origin}/${slug}`;
      document.getElementById('share-url').textContent = shareUrl;
      document.getElementById('share-modal').classList.add('active');
    }
    
    function closeShareModal() {
      document.getElementById('share-modal').classList.remove('active');
    }
    
    function copyShareLink() {
      const url = document.getElementById('share-url').textContent;
      navigator.clipboard.writeText(url).then(() => {
        alert('Link copied to clipboard!');
      }).catch(() => {
        // Fallback for older browsers
        const textArea = document.createElement('textarea');
        textArea.value = url;
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand('copy');
        document.body.removeChild(textArea);
        alert('Link copied to clipboard!');
      });
    }
    
    async function deleteCard(slug) {
      if (!confirm(`Are you sure you want to delete "${slug}"? This cannot be undone.`)) {
        return;
      }
      
      try {
        const response = await fetch(`${API_BASE}/api/cards/${slug}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${localStorage.getItem('authToken')}` },
        });
        
        if (!response.ok) {
          throw new Error('Failed to delete card');
        }
        
        // Reload cards
        loadUserCards();
      } catch (err) {
        alert(`Error: ${err.message}`);
      }
    }
    
    function logout() {
      localStorage.removeItem('authToken');
      localStorage.removeItem('user');
      window.location.href = '/';
    }
    
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
